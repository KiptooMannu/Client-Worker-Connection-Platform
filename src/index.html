<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Kazi Konnect — Hire Verified Local Professionals in Kenya</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />

  <!--
    Base SEO tags live here rather than only in the landing component because
    this build is a client-rendered SPA (no SSR/prerender is wired up), and
    social crawlers do not execute JavaScript. The landing component refines
    these at runtime; these static values are the crawler-visible fallback.
  -->
  <meta name="description"
    content="Kazi Konnect connects you with vetted local professionals. Funds are held in escrow and released only when work is approved, with M-Pesa settlement." />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#29b2c7" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Kazi Konnect" />
  <meta property="og:title" content="Kazi Konnect — Hire Verified Local Professionals in Kenya" />
  <meta property="og:description"
    content="Vetted local professionals, escrow-protected payments, and M-Pesa settlement." />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Kazi Konnect — Hire Verified Local Professionals in Kenya" />
  <meta name="twitter:description"
    content="Vetted local professionals, escrow-protected payments, and M-Pesa settlement." />

  <!-- Site-wide organisation identity. Page-specific schema (e.g. the landing
       page's FAQPage) is injected by its component. -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Kazi Konnect",
      "description": "A marketplace for verified local professionals with escrow-protected payments.",
      "areaServed": "KE"
    }
  </script>

  <!-- Warm up the image CDN used by the hero so the LCP image starts sooner. -->
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet">
  <script>
    if (typeof global === 'undefined') {
      var global = window;
    }
  </script>
</head>

<body>
  <!--
    Splash shown between first paint and Angular taking over. `<app-root>` was
    empty, so the browser painted a blank white page for the whole bootstrap —
    which is what a fresh sign-in looked like. Angular replaces this content on
    render, so nothing needs to clear it. Kept inline and dependency-free so it
    costs no extra request.
  -->
  <app-root>
    <div class="app-splash">
      <div class="app-splash__mark">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 20V7l8-4 8 4v13h-6v-6H10v6H4z" fill="#ffffff" />
        </svg>
      </div>
      <p class="app-splash__word">Kazi Konnect</p>
      <span class="app-splash__ring"></span>
    </div>
  </app-root>

  <style>
    .app-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #f8fafc;
      font-family: Manrope, Inter, system-ui, -apple-system, sans-serif;
    }

    .app-splash__mark {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 15px;
      background: #29b2c7;
      box-shadow: 0 18px 40px -18px rgba(41, 178, 199, 0.7);
    }

    .app-splash__word {
      margin: 0;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #0f172a;
    }

    .app-splash__ring {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2.5px solid rgba(41, 178, 199, 0.22);
      border-top-color: #29b2c7;
      animation: app-splash-spin 0.7s linear infinite;
    }

    @keyframes app-splash-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .app-splash__ring { animation-duration: 2.4s; }
    }
  </style>
</body>

</html>
